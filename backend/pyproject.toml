[project]
name = "ffe-chess-backend"
version = "0.1.0"
description = "FastAPI backend for the FFE chess openings learning agent"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic-settings==2.7.1",
    "chess>=1.11.2",
    "httpx>=0.28.1",
    "stockfish>=5.2.0",
    "pymilvus>=3.0.0",
    "sentence-transformers>=5.6.0",
    "langgraph>=1.2.7",
    "google-api-python-client>=2.198.0",
    "pymongo>=4.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Le projet n'est pas installé comme paquet : on ajoute la racine du backend au
# chemin d'import pour que ``app`` soit importable depuis les tests.
pythonpath = ["."]
# Les tests de l'agent sont asynchrones : le mode « auto » évite de décorer
# chaque fonction avec @pytest.mark.asyncio.
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.20",
]
